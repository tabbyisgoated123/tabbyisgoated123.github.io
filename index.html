<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabby's Games</title>
<link rel="stylesheet" href="assets/css/shared.css">
<link rel="stylesheet" href="assets/css/profile.css">
<link rel="stylesheet" href="assets/css/index.css">
<link rel="stylesheet" href="assets/css/sitefx.css">
</head>
<body class="tabbyos-page">

<main class="tabbyos">
  <div class="tabbyos-wallpaper" aria-hidden="true"></div>
  <header class="tabbyos-topbar">
    <div class="os-mark">TabbyOS // Arch style sandbox</div>
    <div id="os-clock">00:00</div>
  </header>

  <section class="tabbyos-desktop" id="os-desktop">
    <button class="app-icon" data-app="aim.html">Aim Trainer</button>
    <button class="app-icon" data-app="cps.html">CPS Trainer</button>
    <button class="app-icon" data-app="typing.html">TabbyTyping</button>
    <button class="app-icon" data-app="tabbycraft.html">TabbyCraft</button>
    <button class="app-icon" data-app="terminal">Terminal</button>
  </section>

  <section class="app-window hidden" id="app-window">
    <div class="window-bar">
      <span id="window-title">TabbyOS App</span>
      <div class="window-actions">
        <button type="button" id="win-min">_</button>
        <button type="button" id="win-close">x</button>
      </div>
    </div>
    <iframe id="app-frame" title="TabbyOS App Frame"></iframe>
    <div class="terminal-view hidden" id="terminal-view"></div>
  </section>

  <footer class="tabbyos-dock">
    <button type="button" id="start-btn">start</button>
    <span id="dock-label">Ready</span>
  </footer>
</main>

<script src="assets/js/profile.js" defer></script>
<script src="assets/js/sitefx.js" defer></script>
<script src="assets/js/tabbyos.js" defer></script>
</body>
</html>
