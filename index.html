<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabby's Games</title>
<link rel="stylesheet" href="assets/css/shared.css">
<link rel="stylesheet" href="assets/css/profile.css">
<link rel="stylesheet" href="assets/css/index.css">
<link rel="stylesheet" href="assets/css/sitefx.css">
</head>
<body class="tabbyos-page">

<main class="tabbyos">
  <div class="tabbyos-wallpaper" aria-hidden="true"></div>
  <aside class="os-settings" id="os-settings">
    <div class="os-settings-title">TabbyOS Settings</div>
    <label>Accent <input type="color" id="os-accent" value="#ff1a1a"></label>
    <label>Layout
      <select id="os-layout">
        <option value="grid">Grid</option>
        <option value="list">List</option>
      </select>
    </label>
  </aside>

  <section class="tabbyos-desktop" id="os-desktop">
    <button class="app-icon" data-app="aim.html"><span class="icon">🎯</span><span>Aim Trainer</span></button>
    <button class="app-icon" data-app="cps.html"><span class="icon">🖱️</span><span>CPS Trainer</span></button>
    <button class="app-icon" data-app="typing.html"><span class="icon">⌨️</span><span>TabbyTyping</span></button>
    <button class="app-icon" data-app="tabbycraft.html"><span class="icon">🧱</span><span>TabbyCraft</span></button>
    <button class="app-icon" data-app="terminal"><span class="icon">🖥️</span><span>Terminal</span></button>
  </section>

  <div id="window-layer"></div>

  <footer class="tabbyos-dock">
    <button type="button" id="start-btn">start</button>
    <span id="dock-label">Ready</span>
  </footer>
</main>

<script src="assets/js/profile.js" defer></script>
<script src="assets/js/sitefx.js" defer></script>
<script src="assets/js/tabbyos.js" defer></script>
</body>
</html>
